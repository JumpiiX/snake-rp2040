[package]
name = "snake-rp2040"
version = "0.1.0"
edition = "2024"
description = "Bare-metal Rust Snake game for the Raspberry Pi Pico on an 8x8 RGB LED matrix"

[dependencies]
heapless = "0.8.0"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section-lock-mut = "0.1.2"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rp-pico = "0.9.0"
smart-leds = "0.3.0"
ws2812-pio = "0.8.0"

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
